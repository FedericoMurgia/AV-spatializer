; AV Spatializer, ESP32-C3 beta with onboard 0.42" OLED.
; Reference config: board and flags may need adjusting to your exact C3 board.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    fastled/FastLED
    olikraus/U8g2
